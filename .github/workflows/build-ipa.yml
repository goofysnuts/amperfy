name: Build unsigned IPA

# Baut eine unsignierte .ipa für Sideloadly / SideStore (Signatur erfolgt dort mit der eigenen Apple-ID).
on:
  workflow_dispatch:
  push:
    branches: [master, firesonic-ios-build]
    paths-ignore:
      - '**.md'
      - '.github/AppStore/**'
      - '.github/Screenshots/**'

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Neueste Xcode-Version wählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift-Pakete auflösen
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Amperfy.xcodeproj \
            -scheme Amperfy

      - name: Archiv bauen (ohne Signatur)
        run: |
          xcodebuild archive -quiet \
            -project Amperfy.xcodeproj \
            -scheme Amperfy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Amperfy.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""
          test -d "$RUNNER_TEMP/Amperfy.xcarchive/Products/Applications/Amperfy.app"

      - name: IPA packen
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R Amperfy.xcarchive/Products/Applications/Amperfy.app Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/Amperfy.app/Info.plist)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          zip -qry "Amperfy-$VERSION-${GITHUB_SHA::7}-unsigned.ipa" Payload

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Amperfy-${{ env.APP_VERSION }}-unsigned-ipa
          path: ${{ runner.temp }}/*.ipa
          retention-days: 30
